:root {

/* Dark mode */

    color-scheme: dark;

}

/* Common elements */
body {
    background-color: var(--bg-secondary);
    color: var(--text-primary);
}

/* Navigation */
.nav-link {
    color: var(--text-tertiary);
    transition: color 0.2s ease;
}

.nav-link:hover {
    color: var(--text-primary);
}

.nav-link.active {
    color: var(--highlight-color);
}

/* Cards and containers */
.card {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 0.5rem;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
}

.dark .card {
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
}

/* Forms and inputs */
input, select, textarea {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
}

input:focus, select:focus, textarea:focus {
    border-color: var(--highlight-color);
    outline: 2px solid var(--highlight-color);
    outline-offset: 2px;
}

/* Buttons */
.btn {
    padding: 0.5rem 1rem;
    border-radius: 0.375rem;
    font-weight: 500;
    transition: all 0.2s ease;
}

.btn-primary {
    background-color: var(--highlight-color);
    color: white;
}

.btn-primary:hover {
    background-color: var(--highlight-hover);
}

.btn-danger {
    background-color: var(--danger-color);
    color: white;
}

.btn-danger:hover {
    background-color: var(--danger-hover);
}

/* Tables */
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

th {
    background-color: var(--bg-secondary);
    color: var(--text-tertiary);
    font-weight: 500;
    text-align: right;
    padding: 0.75rem 1rem;
}

td {
    padding: 0.75rem 1rem;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-color);
}

tr:hover {
    background-color: var(--bg-secondary);
}

/* Modals */
.modal-backdrop {
    background-color: rgba(0, 0, 0, 0.5);
}

.modal-content {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 0.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.dark .modal-content {
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
}

/* Charts and data visualization */
.chart-container {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 0.5rem;
    padding: 1rem;
}

/* Stats cards */
.stat-card {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 0.5rem;
    padding: 1.5rem;
}

.stat-value {
    color: var(--text-primary);
    font-size: 1.875rem;
    font-weight: bold;
}

.stat-label {
    color: var(--text-tertiary);
    font-size: 0.875rem;
}

/* Search inputs */
.search-container {
    position: relative;
}

.search-input {
    padding-right: 2.5rem;
    width: 100%;
    background-color: var(--bg-primary);
}

.search-icon {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
}

/* Notifications */
.notification {
    border-radius: 0.375rem;
    padding: 1rem;
    margin-bottom: 1rem;
    border: 1px solid transparent;
}

.notification-success {
    background-color: var(--success-color);
    color: white;
}

.notification-error {
    background-color: var(--danger-color);
    color: white;
}

/* Loading states */
.loading-spinner {
    border: 3px solid var(--bg-tertiary);
    border-top: 3px solid var(--highlight-color);
    border-radius: 50%;
    width: 1.5rem;
    height: 1.5rem;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Utilities */
.divide-y > * + * {
    border-top: 1px solid var(--border-color);
}

.shadow-sm {
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

.dark .shadow-sm {

        // Function to identify and process non-working holidays
        function processNonWorkingHolidays(holidaysData) {
            const nonWorkingHolidays = [
                { title: 'Pesach I', hebrew: 'ראשון של פסח' },
                { title: 'Pesach VII', hebrew: 'שביעי של פסח' },
                { title: 'Shavuot I', hebrew: 'חג שבועות' },
                { title: 'Rosh Hashana I', hebrew: 'ראש השנה' },
                { title: 'Yom Kippur', hebrew: 'יום כיפור' },
                { title: 'Sukkot I', hebrew: 'ראשון של סוכות' },
                { title: 'Shmini Atzeret', hebrew: 'שמיני עצרת' }
            ];

            return holidaysData.items
                .filter(item =>
                    nonWorkingHolidays.some(h => h.title === item.title) &&
                    item.category === 'holiday' &&
                    item.subcat === 'major'
                )
                .map(holiday => {
                    const matchedHoliday = nonWorkingHolidays.find(h => h.title === holiday.title);
                    return {
                        date: holiday.date,
                        client: matchedHoliday.hebrew,  // Set client instead of title for display
                        type: 'holiday',
                        description: matchedHoliday.hebrew,
                        'start-time': '00:00',

                    updatedWorkLogs.push({
                        id: `holiday-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                        ...holiday
                    });
                    holidaysAdded++;
                }
            });

            return { updatedWorkLogs, holidaysAdded };
        }

        function calculateTotalHours(logs) {

                    const duration = endTime.diff(startTime, 'hours');
                    return total + duration.hours;

        function validateForm(formId) {
            const form = document.getElementById(formId);
            let isValid = true;

            // Validate required fields and length constraints
            form.querySelectorAll('input, select').forEach(element => {
                const errorId = `${element.id}-error`;
                if (element.hasAttribute('required') && !element.value.trim()) {
                    showError(errorId, 'שדה זה הוא חובה');
                    isValid = false;
                } else if (element.hasAttribute('minlength') &&
                    element.value.trim().length < parseInt(element.getAttribute('minlength'))) {
                    showError(errorId, `אורך מינימלי הוא ${element.getAttribute('minlength')} תווים`);
                    isValid = false;
                } else if (element.hasAttribute('maxlength') &&
                    element.value.trim().length > parseInt(element.getAttribute('maxlength'))) {
                    showError(errorId, `אורך מקסימלי הוא ${element.getAttribute('maxlength')} תווים`);
                    isValid = false;
                } else {
                    hideError(errorId);
                }
            });

            // Validate time range
            const startTime = form.querySelector('[name="start-time"]');
            const endTime = form.querySelector('[name="end-time"]');
            if (startTime && endTime && startTime.value && endTime.value && startTime.value >= endTime.value) {
                showError(
                    `${formId === 'work-log-form' ? '' : formId === 'edit-form' ? 'edit-' : 'day-'}end-time-error`,
                    'שעת הסיום חייבת להיות אחרי שעת ההתחלה'
                );
                isValid = false;

            // Validate attachments for specific leave types

        function generateDonutChart(dayLogs, size = 40) {
            const FULL_DAY_MINUTES = 9 * 60; // 9 hours in minutes
            const radius = size / 2;
            const strokeWidth = size / 8;
            const center = size / 2;

            // Calculate total worked minutes
            const totalMinutes = dayLogs.reduce((sum, log) => {
                if (log.type === 'work') {
                    const startTime = DateTime.fromFormat(log['start-time'], 'HH:mm');
                    const endTime = DateTime.fromFormat(log['end-time'], 'HH:mm');
                    return sum + endTime.diff(startTime, 'minutes').minutes;
                }
                return sum;
            }, 0);

            // Calculate actual percentage without limiting to 100
            const actualPercentage = (totalMinutes / FULL_DAY_MINUTES) * 100;

            // For visual representation, limit the circle fill to 100%
            // but show the actual percentage in text
            const circlePercentage = Math.min(actualPercentage, 100);
            const circumference = 2 * Math.PI * (radius - strokeWidth / 2);
            const dashArray = (circlePercentage * circumference) / 100;
            const dashOffset = circumference - dashArray;

            // Enhanced color scheme including overtime
            const color = actualPercentage > 100 ? '#9333ea' :  // Purple for overtime
                actualPercentage >= 100 ? '#22c55e' :  // Green for complete days
                    actualPercentage >= 75 ? '#3b82f6' :   // Blue for mostly complete
                        actualPercentage >= 50 ? '#eab308' :   // Yellow for half days
                            actualPercentage > 0 ? '#ef4444' :     // Red for partial days
                                '#e5e7eb';                             // Gray for no hours

            // Adjust text size for larger numbers
            const textSize = actualPercentage >= 100 ? size / 3.5 : size / 3;

            return `
        <svg width="${size}" height="${size}" class="inline-block">
            <!-- Background circle -->
            <circle
                cx="${center}"
                cy="${center}"
                r="${radius - strokeWidth / 2}"
                fill="none"
                stroke="#e5e7eb"
                stroke-width="${strokeWidth}"
            />
            <!-- Progress circle -->
            <circle
                cx="${center}"
                cy="${center}"
                r="${radius - strokeWidth / 2}"
                fill="none"
                stroke="${color}"
                stroke-width="${strokeWidth}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${dashOffset}"
                transform="rotate(-90 ${center} ${center})"
            />
            <!-- Percentage text -->
            <text
                x="${center}"
                y="${center}"
                text-anchor="middle"
                dominant-baseline="middle"
                fill="currentColor"
                font-size="${textSize}px"
                ${actualPercentage >= 100 ? 'font-weight="bold"' : ''}
            >${Math.round(actualPercentage)}%</text>
        </svg>
    `;
        }

function generateTimelineHtml(logs) {
    // Create time slots (hours) markers
    const timeSlots = new Array(24).fill().map((_, i) => {
        const time = i.toString().padStart(2, '0') + ':00';
        return `<div class="absolute w-full border-t border-gray-200 text-xs text-gray-500 text-right pr-1" 
            style="top: ${i * (100 / 24)}%">${time}</div>`;
    });

    const processedLogs = handleOverlappingReports(logs);
    const maxOverlap = Math.max(...processedLogs.map(log => log.overlap));

    const logElements = processedLogs.map(log => {
        const startTime = DateTime.fromFormat(log['start-time'], 'HH:mm');
        const endTime = DateTime.fromFormat(log['end-time'], 'HH:mm');
        const top = (startTime.hour + startTime.minute / 60) * (100 / 24);
        let height = (endTime.diff(startTime, 'minutes').minutes / 60) * (100 / 24);
        const minHeight = 5;
        height = Math.max(height, minHeight);

        const color = getColorForLogType(log.type);
        const width = (100 / (maxOverlap + 1)) * 0.9;
        const left = (log.overlap * width);

        // Generate the content based on log type and available space
        let content = '';
        if (log.type === 'holiday') {
            content = `
                <div class="time-display font-bold mb-1">חג</div>
                <div>${log.client}</div>
                <div class="text-xs mt-1">${log['start-time']} - ${log['end-time']}</div>
            `;
        } else {
            content = `
                <div class="time-display">
                    <strong>${getHebrewType(log.type)}</strong><br>
                    ${log['start-time']} - ${log['end-time']}<br>
                    ${log.type === 'work' ? `${log.client} (${log.location})` : log.client}
                </div>
            `;
        }

        // Simplified content for small height items
        if (height <= 8) {
            content = `
                <div class="time-display">
                    <strong>${getHebrewType(log.type)}</strong> 
                    ${log['start-time']} - ${log['end-time']}
                </div>
            `;
        }

        // Generate action buttons based on log type
        const actions = log.type === 'holiday'
            ? '<div class="mt-1 text-xs opacity-75">חג - נקבע אוטומטית</div>'
            : `<div class="timeline-actions mt-1">
                <button onclick="editLog('${log.id}')" class="text-white underline mr-2">ערוך</button>
                <button onclick="deleteLog('${log.id}')" class="text-white underline">מחק</button>
               </div>`;

        // Return the complete timeline item element
        return `
            <div class="timeline-item absolute p-1 text-xs text-white rounded-sm overflow-hidden hover:overflow-visible hover:z-10"
                 data-log-id="${log.id}"
                 data-type="${log.type}"
                 style="top: ${top}%; height: ${height}%; min-height: ${minHeight}%; 
                        background-color: ${color}; width: ${width}%; left: ${left}%; 
                        z-index: 1; border: 1px dashed white;">
                <div class="relative h-full w-full overflow-y-auto">
                    ${content}
                    ${actions}
                </div>
                ${log.type !== 'holiday' ? `
                    <div class="resize-handle resize-top absolute top-0 left-0 right-0 h-1.5 cursor-n-resize 
                              bg-white bg-opacity-20 hover:bg-opacity-40 transition-colors"></div>
                    <div class="resize-handle resize-bottom absolute bottom-0 left-0 right-0 h-1.5 cursor-s-resize 
                              bg-white bg-opacity-20 hover:bg-opacity-40 transition-colors"></div>
                ` : ''}
            </div>
        `;
    });

    // Return the complete timeline HTML
    return `
        <div class="relative h-full overflow-x-auto">
            <div class="absolute inset-0 pr-12">
                ${logElements.join('')}
            </div>
            ${timeSlots.join('')}
        </div>
    `;
}
        function handleOverlappingReports(logs) {
            logs.sort((a, b) => a['start-time'].localeCompare(b['start-time']));
            const overlaps = new Array(logs.length).fill(0);

            for (let i = 0; i < logs.length; i++) {
                for (let j = 0; j < i; j++) {
                    if (logs[i]['start-time'] < logs[j]['end-time']) {
                        overlaps[i] = Math.max(overlaps[i], overlaps[j] + 1);
                    }
                }
            }

            return logs.map((log, index) => ({ ...log, overlap: overlaps[index] }));
        }

        // Add this to your existing JavaScript
        function initializeMobileNav() {
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');

            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', () => {
                    // Toggle the menu visibility
                    if (mobileMenu.classList.contains('hidden')) {
                        mobileMenu.classList.remove('hidden');
                        // Add slide-down animation
                        mobileMenu.style.maxHeight = '0';
                        requestAnimationFrame(() => {
                            mobileMenu.style.transition = 'max-height 0.3s ease-in-out';
                            mobileMenu.style.maxHeight = mobileMenu.scrollHeight + 'px';
                        });
                    } else {
                        // Add slide-up animation
                        mobileMenu.style.maxHeight = '0';
                        mobileMenu.addEventListener('transitionend', () => {
                            mobileMenu.classList.add('hidden');
                        }, { once: true });
                    }

                    // Toggle aria-expanded attribute
                    const isExpanded = mobileMenuButton.getAttribute('aria-expanded') === 'true';
                    mobileMenuButton.setAttribute('aria-expanded', !isExpanded);
                });

                // Close menu when clicking outside
                document.addEventListener('click', (event) => {
                    if (!mobileMenuButton.contains(event.target) &&
                        !mobileMenu.contains(event.target) &&
                        !mobileMenu.classList.contains('hidden')) {
                        mobileMenu.classList.add('hidden');
                        mobileMenuButton.setAttribute('aria-expanded', 'false');
                    }
                });

                // Close menu when window is resized to desktop size
                window.addEventListener('resize', () => {
                    if (window.innerWidth >= 768) { // md breakpoint
                        mobileMenu.classList.add('hidden');
                        mobileMenuButton.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        }

        // Form Handling Functions
        function handleDayFormSubmit(e) {
            e.preventDefault();
            if (!validateForm('day-work-log-form')) return;

            const formData = new FormData(e.target);
            const baseLog = Object.fromEntries(formData.entries());

            // Handle file attachment
            const attachmentInput = document.getElementById('attachment');
            if (attachmentInput && attachmentInput.files.length > 0) {
                baseLog.attachmentName = attachmentInput.files[0].name;
            }

            const enableRecurrence = document.getElementById('day-work-log-form-enable-recurrence');

            if (enableRecurrence && enableRecurrence.checked) {
                // Get recurrence parameters
                const endDate = document.getElementById('day-work-log-form-end-date').value;
                const selectedDays = Array.from(document.querySelectorAll('input[name="weekdays"]:checked'))
                    .map(cb => parseInt(cb.value));

                if (!endDate) {
                    showNotification('יש להזין תאריך סיום', 'error');
                    return;
                }

                if (selectedDays.length === 0) {
                    showNotification('יש לבחור לפחות יום אחד בשבוע', 'error');
                    return;
                }

                // Generate recurring logs
                const startDateTime = DateTime.fromISO(baseLog.date);
                const endDateTime = DateTime.fromISO(endDate);
                const logsToAdd = [];

                let currentDate = startDateTime;
                while (currentDate <= endDateTime) {
                    if (selectedDays.includes(currentDate.weekday)) {
                        const newLog = {
                            ...baseLog,
                            id: Date.now().toString() + Math.random().toString(36).slice(2),
                            date: currentDate.toFormat('yyyy-MM-dd')
                        };
                        logsToAdd.push(newLog);
                    }
                    currentDate = currentDate.plus({ days: 1 });
                }

                // Add all logs
                workLogs.push(...logsToAdd);
                saveWorkLogs();

                showNotification(`נוספו ${logsToAdd.length} דיווחים חוזרים בהצלחה`, 'success');
            } else {
                // Regular single log
                baseLog.id = Date.now().toString();
                workLogs.push(baseLog);
                saveWorkLogs();
                showNotification('הדיווח נשמר בהצלחה', 'success');
            }

            updateReport();

// Timeline Interaction Enhancement
function initializeTimelineInteractions(timelineContainer) {
    let isDragging = false;
    let isResizing = false;
    let resizeDirection = null;
    let activeElement = null;
    let initialY = 0;
    let initialHeight = 0;
    let initialTop = 0;

    // Convert timeline position to time
    function positionToTime(position) {
        const containerHeight = timelineContainer.clientHeight;
        const hours = (position / containerHeight) * 24;
        return DateTime.fromObject({ hour: Math.floor(hours), minute: Math.round((hours % 1) * 60) })
            .toFormat('HH:mm');
    }

    // Convert time to timeline position
    function timeToPosition(time) {
        const [hours, minutes] = time.split(':').map(Number);
        const totalHours = hours + (minutes / 60);
        return (totalHours / 24) * timelineContainer.clientHeight;
    }

    // Add resize handles to timeline items
    function addResizeHandles(element) {
        // Add resize zones at top and bottom
        const topHandle = document.createElement('div');
        topHandle.className = 'resize-handle resize-top';
        topHandle.style.cssText = `
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            cursor: n-resize;
        `;

        const bottomHandle = document.createElement('div');
        bottomHandle.className = 'resize-handle resize-bottom';
        bottomHandle.style.cssText = `
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            cursor: s-resize;
        `;

        element.appendChild(topHandle);
        element.appendChild(bottomHandle);
    }

    // Initialize draggable elements
    function initializeDraggable() {
        const timelineItems = timelineContainer.querySelectorAll('.timeline-item');
        timelineItems.forEach(item => {
            item.style.cursor = 'move';
            item.style.position = 'absolute';
            addResizeHandles(item);
        });
    }

    // Handle mouse down event
    timelineContainer.addEventListener('mousedown', (e) => {
        const timelineItem = e.target.closest('.timeline-item');
        if (!timelineItem) return;

        if (e.target.classList.contains('resize-handle')) {
            // Start resizing
            isResizing = true;
            resizeDirection = e.target.classList.contains('resize-top') ? 'top' : 'bottom';
            activeElement = timelineItem;
            initialY = e.clientY;
            initialHeight = timelineItem.offsetHeight;
            initialTop = timelineItem.offsetTop;
        } else {
            // Start dragging
            isDragging = true;
            activeElement = timelineItem;
            initialY = e.clientY;
            initialTop = timelineItem.offsetTop;
        }

        // Prevent text selection while dragging
        e.preventDefault();
    });

    // Handle mouse move event
    document.addEventListener('mousemove', (e) => {
        if (!isDragging && !isResizing) return;

        const deltaY = e.clientY - initialY;
        const containerHeight = timelineContainer.clientHeight;

        if (isDragging) {
            let newTop = initialTop + deltaY;
            // Constrain to timeline bounds
            newTop = Math.max(0, Math.min(containerHeight - activeElement.offsetHeight, newTop));
            activeElement.style.top = `${newTop}px`;

            // Update time display
            const startTime = positionToTime(newTop);
            const endTime = positionToTime(newTop + activeElement.offsetHeight);
            updateTimeDisplay(activeElement, startTime, endTime);
        }

        if (isResizing) {
            if (resizeDirection === 'top') {
                let newTop = initialTop + deltaY;
                let newHeight = initialHeight - deltaY;
                
                // Constrain resize
                if (newHeight < 20) {
                    newHeight = 20;
                    newTop = initialTop + initialHeight - newHeight;
                }
                
                activeElement.style.top = `${newTop}px`;
                activeElement.style.height = `${newHeight}px`;
            } else {
                let newHeight = initialHeight + deltaY;
                // Minimum height constraint
                newHeight = Math.max(20, newHeight);
                // Maximum height constraint
                newHeight = Math.min(newHeight, containerHeight - activeElement.offsetTop);
                activeElement.style.height = `${newHeight}px`;
            }

            // Update time display
            const startTime = positionToTime(activeElement.offsetTop);
            const endTime = positionToTime(activeElement.offsetTop + activeElement.offsetHeight);
            updateTimeDisplay(activeElement, startTime, endTime);
        }
    });

    // Handle mouse up event
    document.addEventListener('mouseup', () => {
        if (isDragging || isResizing) {
            // Save the new times to the work log
            if (activeElement) {
                const logId = activeElement.dataset.logId;
                const startTime = positionToTime(activeElement.offsetTop);
                const endTime = positionToTime(activeElement.offsetTop + activeElement.offsetHeight);
                
                updateWorkLog(logId, startTime, endTime);
            }
        }
        
        isDragging = false;
        isResizing = false;
        activeElement = null;
    });

    // Update work log data
    function updateWorkLog(logId, startTime, endTime) {
        const logIndex = workLogs.findIndex(log => log.id === logId);
        if (logIndex !== -1) {
            workLogs[logIndex]['start-time'] = startTime;
            workLogs[logIndex]['end-time'] = endTime;
            saveWorkLogs();
        }
    }

    // Update time display in the timeline item
    function updateTimeDisplay(element, startTime, endTime) {
        const timeDisplay = element.querySelector('.time-display');
        if (timeDisplay) {
            timeDisplay.textContent = `${startTime} - ${endTime}`;
        }
    }

    // Initialize draggable elements
    initializeDraggable();
}

        // CSV Export Function
        function exportToCSV() {
            const headers = ['תאריך', 'סוג דיווח', 'מיקום עבודה', 'לקוח לחיוב', 'שעת התחלה', 'שעת סיום'];
            const rows = workLogs.map(log => [
                log.date,
                getHebrewType(log.type),
                log.location,
                log.client,
                log['start-time'],
                log['end-time']
            ]);

            // Prepare CSV content
            let csvContent = [headers, ...rows].map(row =>
                row.map(cell => `"${cell?.replace(/"/g, '""') || ''}"`)
                    .join(',')
            ).join('\r\n');

            // Add BOM for Hebrew support
            const bom = '\uFEFF';
            const blob = new Blob([bom + csvContent], {
                type: 'text/csv;charset=utf-8;'
            });

            // Download file
            const link = document.createElement("a");
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `work_logs_${currentDate.toFormat('yyyy-MM')}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-900">ימים בשבוע:</label>
                    <div class="flex flex-wrap gap-2">
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="weekdays" value="7" class="ml-1"> א'
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="weekdays" value="1" class="ml-1"> ב'
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="weekdays" value="2" class="ml-1"> ג'
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="weekdays" value="3" class="ml-1"> ד'
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="weekdays" value="4" class="ml-1"> ה'
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="weekdays" value="5" class="ml-1"> ו'
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="weekdays" value="6" class="ml-1"> ש'
                        </label>
                    </div>
                </div>
            </div>

            <div class="text-sm text-gray-600 bg-blue-50 p-3 rounded">
                <p>הדיווח יתווסף לכל הימים שנבחרו עד לתאריך הסיום.</p>
            </div>
        </div>
    `;

            // Insert before submit button
            submitButton.parentNode.insertBefore(recurrenceSection, submitButton);

            // Initialize end date picker
            flatpickr(`#${formId}-end-date`, {
                dateFormat: "Y-m-d",
                allowInput: true,
                altInput: true,
                altFormat: "d/m/Y",
                minDate: 'today'
            });

            // Toggle recurrence options visibility
            const enableRecurrence = document.getElementById(`${formId}-enable-recurrence`);
            const recurrenceOptions = document.getElementById(`${formId}-recurrence-options`);

            enableRecurrence.addEventListener('change', () => {
                recurrenceOptions.classList.toggle('hidden', !enableRecurrence.checked);
            });
        }
        function addKeyboardShortcutsHelp() {
            const helpButton = document.createElement('button');
            helpButton.className = 'fixed bottom-4 left-4 bg-gray-800 text-white p-2 rounded-full';
            helpButton.innerHTML = '⌨️';
            helpButton.title = `
        קיצורי מקלדת:
        Alt + N: דיווח חדש להיום
        Alt + ←/→: ניווט בין ימים
    `;
            document.body.appendChild(helpButton);
        }

        // Initialize enhanced features
        document.addEventListener('DOMContentLoaded', () => {
            const originalDisplayDayView = displayDayView;
            displayDayView = function (dateString) {
                originalDisplayDayView(dateString);
                addQuickActionsToForm();
                addCopyPreviousButton();
            };
            const timelineContainer = document.querySelector('.relative.h-[400px]');
            initializeTimelineInteractions(timelineContainer);
            addKeyboardShortcutsHelp();
        });
    </script>
<script src="navigation.js"></script>
</body>
